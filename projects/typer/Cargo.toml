[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
typer-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# TLS for the terminal client: `wss://` behind Pangolin, no openssl and no
# system package. ring rather than aws-lc-rs: no cmake/NASM in the sandbox.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
