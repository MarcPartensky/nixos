# mnemo, pod bootstrap: apply this with kubectl to start the service WITHOUT a
# nixos rebuild.
#
#   KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f deploy/mnemo.yaml
#
# This file is generated by hand from module.nix, which stays the source of
# truth: at the next `just nixos`, services.k3s.manifests.mnemo replaces this
# object with exactly the same spec. Keep the two in sync when changing either.
#
# Prerequisites (no root needed for the pod itself):
#   - the image is in containerd: `k3s ctr images import /var/lib/hermes/mnemo/mnemo-oci.tar`
#   - /var/lib/mnemo exists, owned by 988:982
#   - the postgres role and database `mnemo` exist (the module does it via
#     ensureDatabases; without a rebuild, create them with psql)
apiVersion: v1
kind: Namespace
metadata:
  name: mnemo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemo
  namespace: mnemo
  labels:
    app: mnemo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mnemo
  template:
    metadata:
      labels:
        app: mnemo
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 988
        runAsGroup: 982
        runAsNonRoot: true
      containers:
        - name: mnemo
          image: mnemo:0.1.0
          imagePullPolicy: Never
          args: ["serve"]
          ports:
            - name: http
              containerPort: 9152
              hostPort: 9152
          env:
            - name: HOME
              value: /data
            # Loopback only: the pod runs with hostNetwork, so 127.0.0.1 here is
            # the host's own loopback and Pangolin's target still works. Do NOT
            # rely on the firewall to close this port: tailscale0 is a trusted
            # interface, so 0.0.0.0 was reachable from every device of the
            # tailnet (measured, not assumed).
            - name: MNEMO_BIND
              value: 127.0.0.1
            - name: MNEMO_PORT
              value: "9152"
            # Pangolin terminates the login; the port is loopback, so a second
            # token in the browser would only break the page.
            - name: MNEMO_OPEN
              value: "1"
            - name: MNEMO_DB
              value: postgres://mnemo@127.0.0.1:5432/mnemo
            - name: MNEMO_SESSIONS_DB
              value: /data/state.db
            - name: MNEMO_TOKEN_FILE
              value: /var/lib/mnemo/mnemo-token
            - name: MNEMO_BRIEF_DIR
              value: /var/lib/mnemo/briefs
            - name: MNEMO_TYPER_DIR
              value: /var/lib/mnemo/typer-lang
            - name: MNEMO_HUB_URL
              value: http://127.0.0.1:8095
            - name: MNEMO_HUB_TOKEN_FILE
              value: /data/podcast-hub-token
            - name: MNEMO_LLM_URL
              value: http://100.64.0.4:8094/v1
            - name: MNEMO_LLM_MODEL
              value: free-pool
            - name: MNEMO_MIN_PRIORITY
              value: "8.0"
            - name: MNEMO_BATCH
              value: "5"
            # Generous on purpose: a reasoning model spends most of the budget on
            # its scratchpad, and a tight limit returns a truncated answer.
            - name: MNEMO_ANALYZE_TOKENS
              value: "8000"
            - name: MNEMO_BRIEF_TOKENS
              value: "6000"
          volumeMounts:
            - name: hermes
              mountPath: /data
              readOnly: true
            - name: state
              mountPath: /var/lib/mnemo
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9152
              # Required: with hostNetwork the kubelet probes the pod IP (the
              # node IP) by default, which a loopback-bound server refuses, so
              # the pod would never go Ready.
              host: 127.0.0.1
            initialDelaySeconds: 3
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9152
              host: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 60
      volumes:
        - name: hermes
          hostPath:
            path: /var/lib/hermes/.hermes
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/mnemo
            type: Directory
