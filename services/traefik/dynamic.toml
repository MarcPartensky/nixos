# --- SERVICES ---
[http.services.vaultwarden.loadBalancer]
  [[http.services.vaultwarden.loadBalancer.servers]]
    url = "http://127.0.0.1:8222"

[http.services.nextcloud.loadBalancer]
  [[http.services.nextcloud.loadBalancer.servers]]
    url = "http://127.0.0.1:8081"

[http.services.pangolin.loadBalancer]
  [[http.services.pangolin.loadBalancer.servers]]
    url = "http://127.0.0.1:3002"

[http.services.pangolin-api.loadBalancer]
  [[http.services.pangolin-api.loadBalancer.servers]]
    url = "http://127.0.0.1:3007"

[http.services.stalwart.loadBalancer]
  [[http.services.stalwart.loadBalancer.servers]]
    url = "http://127.0.0.1:8090"

[http.services.zitadel.loadBalancer]
  [[http.services.zitadel.loadBalancer.servers]]
    url = "http://127.0.0.1:2080"

# API d'intégration Pangolin (MCP, scripts) — activée par
# flags.enable_integration_api dans services/pangolin/default.nix.
# Le module nixpkgs pangolin définit ces routeurs via dynamicConfigOptions,
# mais cette archi-ci (dynamicConfigFile custom) ne les prend pas : la route
# est donc posée ici, main dans la main avec le flag.
[http.services.int-api.loadBalancer]
  [[http.services.int-api.loadBalancer.servers]]
    url = "http://127.0.0.1:3003"

# headscale (contrôleur du mesh tailscale, cf services/headscale) : porte aussi
# le DERP embarqué des clients (/derp) ; le STUN est à part, en UDP 3478.
[http.services.headscale.loadBalancer]
  [[http.services.headscale.loadBalancer.servers]]
    url = "http://127.0.0.1:8090"

# --- ROUTERS ---
[http.routers.traefik]
  rule = "Host(`traefik.vps.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "api@internal"
  tls = { certResolver = "letsencrypt" }

[http.routers.vaultwarden]
  rule = "Host(`vault.vps.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "vaultwarden"
  tls = { certResolver = "letsencrypt" }

[http.routers.nextcloud]
  rule = "Host(`cloud.vps.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "nextcloud"
  tls = { certResolver = "letsencrypt" }

[http.routers.pangolin]
  rule = "Host(`pangolin.vps.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "pangolin"
  priority = 1
  tls = { certResolver = "letsencrypt" }

[http.routers.pangolin-api]
  rule = "Host(`pangolin.vps.marcpartensky.com`) && PathPrefix(`/api/`)"
  entryPoints = ["websecure"]
  service = "pangolin-api"
  priority = 100
  tls = { certResolver = "letsencrypt" }

[http.routers.stalwart]
  rule = "Host(`mail.vps.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "stalwart"
  tls = { certResolver = "letsencrypt" }

[http.routers.zitadel]
  rule = "Host(`auth.vps.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "zitadel"
  tls = { certResolver = "letsencrypt" }

[http.routers.int-api]
  rule = "Host(`api.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "int-api"
  tls = { certResolver = "letsencrypt" }

[http.routers.headscale]
  rule = "Host(`headscale.marcpartensky.com`)"
  entryPoints = ["websecure"]
  service = "headscale"
  tls = { certResolver = "letsencrypt" }
