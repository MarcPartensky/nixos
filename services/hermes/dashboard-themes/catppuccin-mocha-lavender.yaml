# Catppuccin Mocha + Lavender accent (marc's theme, aligned with the skin
# display.skin = catppuccin-dark-lavender of the default profile).
#
# Format: USER theme of the dashboard (DashboardAuthProvider / ThemeProvider).
# Read from <hermes-home>/dashboard-themes/*.yaml by _discover_user_themes().
# colorOverrides -> CSS variables --color-* ; palette -> --background-base /
# --midground-base ; typography/layout -> --theme-* ; customCSS injected as is.
name: catppuccin-mocha-lavender
label: Catppuccin Mocha (Lavender)
description: Catppuccin Mocha, Lavender accent, marc's palette

palette:
  background:
    hex: "#1e1e2e"
    alpha: 1
  midground:
    hex: "#cdd6f4"
    alpha: 1
  foreground:
    hex: "#ffffff"
    alpha: 0
  warmGlow: "rgba(180, 190, 254, 0.28)"
  noiseOpacity: 0.4

typography:
  fontSans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: 'ui-monospace, "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  baseSize: 15px
  lineHeight: "1.55"
  letterSpacing: "0"

layout:
  radius: 0.5rem
  density: comfortable

colorOverrides:
  card: "#181825"
  cardForeground: "#cdd6f4"
  popover: "#181825"
  popoverForeground: "#cdd6f4"
  primary: "#b4befe"
  primaryForeground: "#1e1e2e"
  secondary: "#313244"
  secondaryForeground: "#cdd6f4"
  muted: "#313244"
  mutedForeground: "#a6adc8"
  accent: "#45475a"
  accentForeground: "#cdd6f4"
  destructive: "#f38ba8"
  destructiveForeground: "#1e1e2e"
  success: "#a6e3a1"
  warning: "#f9e2af"
  border: "#45475a"
  input: "#313244"
  ring: "#b4befe"

seriesColors:
  inputTokenAccent: "#94e2d5"
  outputTokenAccent: "#b4befe"

componentStyles:
  sidebar:
    background: "#181825"
    borderColor: "#313244"

customCSS: |
  /* Mocha: the sidebar and the body share the Mantle/Crust tones,
     the Lavender accent stays reserved for accent roles. */
  :root {
    --color-sidebar: #181825;
  }
