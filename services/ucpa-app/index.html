<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCPA February 2027</title>
<style>
  :root{
    /* Palette sampled from ucpa.com: red #e81d00, navy #0f1f28, cyan #00a6c6,
       green #8cbe00, yellow #fdc700, grey #e6ecf2 / #c8cdd2. */
    --base:#f5f5f5; --mantle:#ffffff; --crust:#eef1f4;
    --s0:#e6ecf2; --s1:#c8cdd2; --s2:#a9b3bb;
    --text:#0f1f28; --sub:#3d4c55; --overlay:#5b6f7a;
    --lav:#e81d00; --green:#5d7c00; --red:#e81d00; --yellow:#8a6d00;
    --peach:#ff4310; --blue:#007e96; --mauve:#0f1f28; --teal:#007e96;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--base);color:var(--text);
    font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--blue);text-decoration:none}
  a:hover{text-decoration:underline}
  button,select,input{font:inherit;color:inherit}
  header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--s1);
    box-shadow:inset 0 3px 0 var(--red)}
  .bar{display:flex;align-items:center;gap:16px;padding:15px 22px;max-width:1500px;margin:0 auto}
  .brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
  .brand b{font-size:21px;letter-spacing:.04em;color:var(--red);font-weight:800}
  .brand span{color:var(--sub);font-size:12.5px}
  .spacer{flex:1}
  .stat{font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
  .stat b{color:var(--text);font-weight:600}
  .iconbtn{background:var(--mantle);border:1px solid var(--s1);border-radius:10px;
    padding:7px 13px;cursor:pointer;font-size:12.5px;color:var(--text);font-weight:600}
  .iconbtn:hover{border-color:var(--text);background:var(--crust)}
  .iconbtn[disabled]{opacity:.6;cursor:progress}
  .filters{position:sticky;top:63px;z-index:25;background:var(--mantle);
    border-bottom:1px solid var(--s0);padding:12px 22px}
  .filters .inner{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;
    gap:10px 22px;align-items:flex-end}
  .grp{display:flex;flex-direction:column;gap:6px}
  .grp > label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--overlay);font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--mantle);border:1px solid var(--s1);color:var(--sub);
    border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;
    transition:background .12s,border-color .12s,color .12s}
  .chip:hover{border-color:var(--text);color:var(--text)}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}
  .range{display:flex;align-items:center;gap:8px}
  input[type=range]{width:150px;accent-color:var(--red)}
  .range output{font-variant-numeric:tabular-nums;font-size:12.5px;min-width:64px;color:var(--text)}
  select{background:var(--mantle);border:1px solid var(--s1);border-radius:9px;
    padding:6px 9px;font-size:12.5px}
  .toggles{display:flex;gap:14px;align-items:center;padding-bottom:3px}
  .tg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);cursor:pointer}
  .tg input{accent-color:var(--red)}
  main{max-width:1500px;margin:0 auto;padding:18px 22px 60px}
  .countline{display:flex;align-items:center;gap:12px;margin:0 0 14px;color:var(--sub);font-size:12.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{background:var(--mantle);border:1px solid var(--s0);border-radius:var(--r);
    padding:14px 15px;display:flex;flex-direction:column;gap:9px;cursor:pointer;
    transition:border-color .12s,box-shadow .12s,transform .12s}
  .card:hover{border-color:var(--red);box-shadow:0 2px 10px rgba(15,31,40,.08);transform:translateY(-1px)}
  .card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .thumb{width:54px;height:54px;border-radius:10px;object-fit:cover;flex:0 0 auto;
    background:var(--crust);border:1px solid var(--s0)}
  .head{display:flex;gap:10px;align-items:flex-start;min-width:0}
  .head > div{min-width:0}
  .center{font-size:11.5px;color:var(--overlay);text-transform:uppercase;letter-spacing:.05em}
  .name{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.28;margin-top:2px}
  .price{text-align:right;white-space:nowrap}
  .price b{font-size:19.5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--red)}
  .price small{display:block;color:var(--overlay);font-size:11px}
  .badges{display:flex;flex-wrap:wrap;gap:5px}
  .badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--s0);
    color:#38464f;white-space:nowrap}
  .badge.formula{background:rgba(232,29,0,.10);color:#9c1300}
  .badge.age{background:rgba(0,166,198,.13);color:#00667a}
  .badge.stock{background:rgba(140,190,0,.20);color:#3f5600}
  .badge.low{background:rgba(232,29,0,.14);color:#8f1200}
  .badge.guar{background:rgba(253,199,0,.28);color:#6b5400}
  .dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
  .dt{font-size:11.5px;background:var(--crust);border:1px solid var(--s0);
    border-radius:8px;padding:3px 7px;color:var(--sub);font-variant-numeric:tabular-nums}
  .dt b{color:var(--text);font-weight:700}
  .empty{color:var(--sub);padding:40px 0;text-align:center}
  .modal{position:fixed;inset:0;background:rgba(15,31,40,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 18px;z-index:60;overflow:auto}
  .modal.on{display:flex}
  .sheet{background:var(--mantle);border:1px solid var(--s1);border-radius:16px;
    max-width:820px;width:100%;padding:20px 22px 24px;
    box-shadow:0 18px 50px rgba(15,31,40,.22)}
  .sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
  .sheet table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
  .sheet th{text-align:left;color:var(--overlay);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.07em;padding:6px 8px;border-bottom:1px solid var(--s1)}
  .sheet td{padding:7px 8px;border-bottom:1px solid var(--s0);font-variant-numeric:tabular-nums}
  .sheet tr:last-child td{border-bottom:0}
  .sheet td.n{text-align:right}
  .sheet td.n b{color:var(--red)}
  .muted{color:var(--sub);font-size:12.5px}
  .close{position:sticky;float:right;background:var(--mantle);border:1px solid var(--s1);
    border-radius:9px;padding:5px 11px;cursor:pointer}
  .close:hover{border-color:var(--text)}
  .loading{padding:60px 0;text-align:center;color:var(--sub)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--red);margin-right:7px;animation:p 1.1s infinite}
  @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
  footer{max-width:1500px;margin:0 auto;padding:0 22px 40px;color:var(--overlay);font-size:11.5px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><b>UCPA</b><span>February 2027 · ski &amp; snowboard · age 26</span></div>
    <div class="spacer"></div>
    <div class="stat" id="stat">loading…</div>
    <button class="iconbtn" id="refresh">Refresh</button>
  </div>
</header>

<div class="filters">
  <div class="inner">
    <div class="grp"><label>Discipline</label><div class="chips" id="f-family"></div></div>
    <div class="grp"><label>Formula</label><div class="chips" id="f-formula"></div></div>
    <div class="grp"><label>Duration</label><div class="chips" id="f-nights"></div></div>
    <div class="grp"><label>Max price / person</label>
      <div class="range"><input type="range" id="f-price" min="300" max="2600" step="50" value="2600">
      <output id="f-price-out">2 600 €</output></div></div>
    <div class="grp"><label>Search</label>
      <input id="f-q" type="search" placeholder="resort, stay…" autocomplete="off"
        style="background:var(--mantle);border:1px solid var(--s1);border-radius:9px;
               padding:6px 9px;font-size:12.5px;width:190px"></div>
    <div class="grp"><label>Sort</label>
      <select id="f-sort">
        <option value="price">Price ascending</option>
        <option value="night">Price per night</option>
        <option value="date">Departure date</option>
        <option value="stock">Available spots</option>
      </select></div>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="f-age" checked> eligible at 26</label>
      <label class="tg"><input type="checkbox" id="f-open"> 3 spots min</label>
      <label class="tg"><input type="checkbox" id="f-guar"> guaranteed departure</label>
      <label class="tg"><input type="checkbox" id="f-full"> full stays</label>
    </div>
  </div>
</div>

<main>
  <div class="countline" id="countline"></div>
  <div id="list"><div class="loading"><span class="dot"></span>first UCPA sweep…</div></div>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<footer>
  Price per person, excluding transport, tourist tax and options. Source:
  ucpa.com, sessions and spots read from each stay's page.
</footer>

<script>
const state = { family:'all', formula:'all', nights:'all', price:2600,
                sort:'price', age:true, open:false, guar:false, full:false, q:'' };
let DATA = null;

const fmtEuro = n => (n==null? '—' : Math.round(n).toLocaleString('fr-FR')+' €');
const fmtDate = iso => { const [y,m,d]=iso.split('-'); return d+'/'+m; };
const pn = n => (n==null? '—' : Math.round(n).toLocaleString('fr-FR')+' €/night');

function chips(el, items, key){
  el.innerHTML='';
  items.forEach(([value,label])=>{
    const b=document.createElement('button');
    b.className='chip'+(state[key]===value?' on':'');
    b.textContent=label;
    b.onclick=()=>{ state[key]=value; render(); };
    el.appendChild(b);
  });
}

const FAMILIES=[['all','All'],['ski','Ski'],['snowboard','Snowboard'],
  ['rando','Touring'],['nordique','Nordic'],['biathlon','Biathlon'],['raquettes','Snowshoes']];
const FORMULAS=[['all','All'],['mini','Mini'],['mi-temps','Half-time'],
  ['plein-temps','Full-time'],['apprendre','Learn'],['decouverte','Discovery'],
  ['hors-piste','Off-piste'],['rando','Touring']];
const NIGHTS=[['all','All'],['week','Week (6-8 n)'],['short','Short (2-5 n)']];

function matches(r){
  if(state.family!=='all' && r.family!==state.family) return false;
  if(state.formula!=='all' && r.formula!==state.formula) return false;
  if(state.nights==='week' && !(r.nights||[]).some(n=>n>=6&&n<=8)) return false;
  if(state.nights==='short' && !(r.nights||[]).some(n=>n>=2&&n<=5)) return false;
  if(state.price<2600 && (r.price_min==null || r.price_min>state.price)) return false;
  if(state.age && !((r.age_min<=26)&&(r.age_max>=26))) return false;
  if(state.open){
    const best = Math.max(0, ...(r.sessions||[])
      .filter(s=>s.available && s.stock!=null).map(s=>s.stock));
    if(best < 3) return false;
  }
  if(state.guar && !r.guaranteed) return false;
  if(!state.full && !(r.sessions_open>0)) return false;
  if(state.q){
    const hay=((r.name||'')+' '+(r.center||'')+' '+(r.activity_name||'')).toLowerCase();
    if(!hay.includes(state.q)) return false;
  }
  return true;
}

function sortRows(rows){
  const s=state.sort;
  return rows.slice().sort((a,b)=>{
    if(s==='night') return (a.price_per_night??9e9)-(b.price_per_night??9e9);
    if(s==='date') return (a.next_date||'9')<(b.next_date||'9')?-1:1;
    if(s==='stock') return (b.sessions_open||0)-(a.sessions_open||0);
    return (a.price_min??9e9)-(b.price_min??9e9);
  });
}

function card(r){
  const dates = (r.sessions||[]).slice(0,4).map(s=>{
    const low = s.stock!=null && s.stock<=2;
    return `<span class="dt">${fmtDate(s.date)} · <b>${fmtEuro(s.price)}</b>${low?' <span style="color:var(--red)">· '+s.stock+' spots</span>':''}</span>`;
  }).join('');
  const formulaLabel = (DATA.formulas.find(f=>f.key===r.formula)||{}).label || '';
  const nights = (r.nights||[]).join(' or ');
  return `<article class="card" data-uuid="${r.uuid}">
    <div class="top">
      <div class="head">
        ${r.image?`<img class="thumb" loading="lazy" alt="" src="${r.image}">`:''}
        <div><div class="center">${r.center||''}</div>
        <div class="name">${r.name}</div></div>
      </div>
      <div class="price"><b>${fmtEuro(r.price_min)}</b><small>${pn(r.price_per_night)}</small></div>
    </div>
    <div class="badges">
      <span class="badge formula">${formulaLabel}</span>
      <span class="badge">${nights} nights</span>
      <span class="badge age">${r.age_min}–${r.age_max} years</span>
      ${r.guaranteed?'<span class="badge guar">guaranteed departure</span>':''}
      <span class="badge ${r.sessions_open?'stock':'low'}">${r.sessions_open} open session${r.sessions_open>1?'s':''}</span>
    </div>
    <div class="dates">${dates}</div>
  </article>`;
}

function render(){
  if(!DATA) return;
  chips(document.getElementById('f-family'),FAMILIES,'family');
  chips(document.getElementById('f-formula'),FORMULAS,'formula');
  chips(document.getElementById('f-nights'),NIGHTS,'nights');
  document.getElementById('f-price-out').textContent =
    state.price>=2600?'all':fmtEuro(state.price);
  const rows = sortRows(DATA.rows.filter(matches));
  const el=document.getElementById('list');
  document.getElementById('countline').innerHTML =
    `<b>${rows.length}</b> stay${rows.length>1?'s':''} of ${DATA.rows.length}`+
    ` · ${DATA.offers_matched} offers scanned`+
    ` <button id="reset" class="chip" style="margin-left:6px">reset</button>`;
  const reset = document.getElementById('reset');
  if(reset) reset.onclick = () => {
    state.family='all'; state.formula='all'; state.nights='all'; state.price=2600;
    state.sort='price'; state.age=true; state.open=false; state.guar=false;
    state.full=false; state.q='';
    document.getElementById('f-price').value=2600;
    document.getElementById('f-sort').value='price';
    document.getElementById('f-q').value='';
    document.getElementById('f-age').checked=true;
    ['f-open','f-guar','f-full'].forEach(id=>document.getElementById(id).checked=false);
    render();
  };
  el.innerHTML = rows.length? `<div class="grid">${rows.map(card).join('')}</div>`
                            : '<div class="empty">no stay matching these criteria</div>';
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.uuid));
}

function openDetail(uuid){
  const r = DATA.rows.find(x=>x.uuid===uuid); if(!r) return;
  const rows = (r.sessions||[]).map(s=>`<tr>
      <td>${s.date.split('-').reverse().join('/')}</td>
      <td>${s.nights} nights</td>
      <td class="n"><b>${fmtEuro(s.price)}</b></td>
      <td class="n">${s.transport?fmtEuro(s.transport):'—'}</td>
      <td class="n">${s.stock==null?'—':s.stock}</td>
      <td>${s.available? (s.guaranteed||'available') : 'full'}</td>
    </tr>`).join('');
  document.getElementById('sheet').innerHTML = `
    <button class="close" onclick="closeDetail()">close</button>
    <div class="center">${r.center||''}</div>
    <h2>${r.name}</h2>
    <div class="muted">${r.age_min}–${r.age_max} years · ${(r.nights||[]).join(' or ')} nights ·
      ${r.activity_name||r.activity} · from ${fmtEuro(r.price_min)} per person
      (${pn(r.price_per_night)})</div>
    <table>
      <tr><th>Departure</th><th>Duration</th><th style="text-align:right">Price without transport</th>
      <th style="text-align:right">With transport</th><th style="text-align:right">Spots</th><th>Status</th></tr>
      ${rows}
    </table>
    <p class="muted" style="margin-top:14px">
      Price per person, lodging + full board + pass + equipment
      ${r.formula==='mini'?'(no lessons)':''}. <a href="${r.url}" target="_blank" rel="noopener"
      style="text-decoration:underline">open the page on ucpa.com</a>
    </p>`;
  document.getElementById('modal').classList.add('on');
}
function closeDetail(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').onclick = e => { if(e.target.id==='modal') closeDetail(); };
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

document.getElementById('f-price').oninput = e => { state.price=+e.target.value; render(); };
document.getElementById('f-sort').onchange = e => { state.sort=e.target.value; render(); };
['f-age','f-open','f-guar','f-full'].forEach(id=>{
  const key = {'f-age':'age','f-open':'open','f-guar':'guar','f-full':'full'}[id];
  document.getElementById(id).onchange = e => { state[key]=e.target.checked; render(); };
});
let qtimer;
document.getElementById('f-q').oninput = e => {
  clearTimeout(qtimer);
  const v = e.target.value.trim().toLowerCase();
  qtimer = setTimeout(()=>{ state.q=v; render(); }, 90);
};

function statText(){
  const d = new Date(DATA.generated_at*1000);
  const hh = d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  const dd = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  document.getElementById('stat').innerHTML =
    `<b>${DATA.rows.length} stays</b> · ${DATA.products_scanned} pages · read on ${dd} ${hh}`+
    (DATA.stale?' · <span style="color:var(--yellow)">update in progress</span>':'');
}

async function load(){
  const r = await fetch('/api/catalog');
  if(r.status===202){ setTimeout(load, 2500); return; }
  DATA = await r.json();
  statText(); render();
  if(DATA.building || DATA.stale) setTimeout(load, 4000);
}

document.getElementById('refresh').onclick = async e => {
  e.target.disabled=true; e.target.textContent='refreshing…';
  await fetch('/api/refresh',{method:'POST'});
  setTimeout(()=>{ load(); e.target.disabled=false; e.target.textContent='Refresh'; }, 3000);
};

load();
</script>
</body>
</html>
