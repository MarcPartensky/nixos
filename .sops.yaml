keys:
  - &anywhere age189v3q8quejkaz4r8u0g2aechsfk4sk3465khx35erd320rea5scq98v7er
  - &tower age1usm3v0ugducrzcwud60dda7xfnj49fdhecj7kcsfm7dzwzrzeyqq2jc2hm
  - &mac age1fwgg9h68zz8s6xa8qt4yn7gqcqp59s0mma8xdfq9hunksqv8fq4qd9yfaz
  - &deck age154uz4pavaj5qth25ytj0q8chsya4y65pgel04zcrm02je9w6uc9sug7dp2
  - &deck-host age1rhnaejc5nwcqcuq5qt45wzr2fncurlwqw0adhnavfraqsdzffatqh5yhl4
  # age key of the LAPTOP (derived from its /etc/ssh/ssh_host_ed25519_key; verified
  # on 20/11/2026: ssh-to-age of the host public key = this value). The
  # laptop serves as the Hermes fallback and produces the pqbox backups, so it
  # must be able to decrypt the agent's secrets.
  - &laptop age1mxdsyddxl2p854hhulg9vwt7t36fy9z9jyudfdxujkacgfcp55uq9taurs

creation_rules:
  # arr-mcp (services/arr-mcp): Radarr/Sonarr/Prowlarr/Jellyfin API keys and
  # MCP token. The container and hermes run on tower; no fallback
  # host decrypts this file (do not import it elsewhere).
  - path_regex: secrets/arr-mcp\.yml$
    key_groups:
      - age:
          - *tower
  # Aonsoku (services/aonsoku): Subsonic password of the dedicated
  # non-admin Navidrome account "aonsoku", injected into the web client by
  # APP_USER/APP_PASSWORD so the SPA logs in alone. The value ends up in the JS
  # served to the browser, hence the Pangolin SSO gate in front of it. Tower
  # only: the container and the rendered file live there.
  - path_regex: secrets/aonsoku\.yml$
    key_groups:
      - age:
          - *tower
  # Open Notebook (services/open-notebook): application encryption key.
  - path_regex: secrets/open-notebook\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/monero-deck\.yml$
    key_groups:
      - age:
          - *tower
          - *deck-host
  # Switch keys (prod.keys) for Eden on the deck (placed in marc's home)
  - path_regex: secrets/switch-keys\.yml$
    key_groups:
      - age:
          - *tower
          - *deck-host
  - path_regex: secrets/monero\.yml$
    key_groups:
      - age:
          - *tower
          - *deck
  - path_regex: secrets/common\.yml$
    key_groups:
      - age:
          - *anywhere
          - *tower
          - *mac
          - *deck
          - *deck-host
  # tower's internal TLS proxy (Traefik, Cloudflare DNS-01 challenge): the
  # Cloudflare token is only used by tower, no other host decrypts it.
  - path_regex: secrets/traefik\.yml$
    key_groups:
      - age:
          - *tower
  # tailnet internal CA (step): the ROOT key must never live on tower,
  # only the offline backup holds it. The INTERMEDIATE key signs the
  # service certificates on tower and exists only there.
  - path_regex: secrets/intra-ca-root\.yml$
    key_groups:
      - age:
          - *anywhere
          - *mac
  - path_regex: secrets/intra-ca\.yml$
    key_groups:
      - age:
          - *tower
  # ygg-mesh network (services/ygg-mesh): password common to the machines
  # that are members of the mesh. Same recipients as common.yml, without the mac.
  - path_regex: secrets/ygg-mesh\.yml$
    key_groups:
      - age:
          - *anywhere
          - *tower
          - *deck
          - *deck-host
  # headscale mesh (services/headscale + services/tailscale): pre-authentication
  # key shared by the tailnet nodes, created on the VPS.
  - path_regex: secrets/headscale\.yml$
    key_groups:
      - age:
          - *anywhere
          - *tower
          - *mac
          - *deck-host
  - path_regex: secrets/stalwart-mcp\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/hermes_api_server_env\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/mac\.yml$
    key_groups:
      - age:
          - *mac
  - path_regex: secrets/anywhere\.yml$
    key_groups:
      - age:
          - *anywhere
  - path_regex: secrets/wireguard\.yml$
    key_groups:
      - age:
          - *tower
  # Vaultwarden vault DEDICATED TO THE AGENT (hermes@marcpartensky.com account):
  # master password of a vault that contains only revocable
  # capabilities. Separate from marc's vault so that the driven browser never
  # touches the main one. See services/vaultwarden-mcp.
  - path_regex: secrets/vaultwarden-agent\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/tower\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/protonmail\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/zitadel\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/zitadel-smtp\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/hermes-matrix\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/hermes-discord\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/discord-hermes-bridge\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/hermes-dashboard\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/reactive-resume\.yml$
    key_groups:
      - age:
          - *tower
  # Shlink (services/shlink): Postgres password + initial API key.
  - path_regex: secrets/shlink\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/gitea\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/gitea-oidc\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/gitea-mcp\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/openrouter-mcp\.yml$
    key_groups:
      - age:
          - *tower
  # API key of the direct DeepSeek account, shared by two consumers: the
  # usage dashboard (balance, reads deepseek_api_key) and the hermes agent (custom
  # provider deepseek-direct, reads hermes_deepseek_env, a dotenv content).
  - path_regex: secrets/deepseek\.yml$
    key_groups:
      - age:
          - *tower
  # Key of the Meta Model API account (muse-ember-1.0, muse-spark-1.3, muse-wonder).
  # Consumed by hermes's BUILT-IN meta-ai provider (env MODEL_API_KEY), in
  # Standard mode only: no training on the content.
  - path_regex: secrets/meta\.yml$
    key_groups:
      - age:
          - *tower
  # Gemini key via Google AI Studio, consumed by hermes's BUILT-IN gemini
  # provider (env GOOGLE_API_KEY). Dotenv content, like deepseek/meta. Verified on
  # 20/11/2026: HTTP 200 on /v1beta/models, 65 models (gemini-3.8-flash,
  # gemini-4-argon, gemini-3.1-pro). Free tier = prompts used to improve
  # Google products; paid tier to avoid training.
  - path_regex: secrets/hermes-gemini\.yml$
    key_groups:
      - age:
          - *tower
  # LLM usage dashboard (services/usage-dashboard): OpenRouter management key
  # (read-only, analytics) + inference key (real-time usage) + Moonshot
  # key (balance of the kimi direct provider).
  - path_regex: secrets/usage-dashboard\.yml$
    key_groups:
      - age:
          - *tower
  # BeEF (services/beef): operator console password. The rest of the
  # module has no secret (the quick tunnel name is public by nature).
  - path_regex: secrets/beef\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/codeberg\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/audiobookshelf\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/ibkr\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/kasmvnc\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/anki\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/gotify-mesh\.yml$
    key_groups:
      - age:
          - *tower
  # Gotify server (services/gotify): moved to the VPS on 20/11/2026. The
  # file is encrypted for BOTH hosts because the server runs on anywhere
  # (creation password + postgres role) and the bridge consumers
  # (gotify-pont-provision, API basic auth) run on tower.
  - path_regex: secrets/gotify\.yml$
    key_groups:
      - age:
          - *anywhere
          - *tower
  # Gotify <-> Matrix bridge (services/gotify-matrix): local password of the
  # Gotify admin account. The gotify-pont-provision unit aligns the bcrypt hash in
  # the database to this value (the historical password was no longer known), then
  # creates the bridge's application + client tokens.
  - path_regex: secrets/gotify-matrix\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/winnie\.yml$
    key_groups:
      - age:
          - *tower
  - path_regex: secrets/wise\.yml$
    key_groups:
      - age:
          - *tower
  # Personal F-Droid repo (services/fdroid-repo): repo signing key
  # (JKS keystore in base64) + its password. Losing it forces clients to
  # re-add the repo (new fingerprint), hence the encrypted storage in git.
  - path_regex: secrets/fdroid\.yml$
    key_groups:
      - age:
          - *tower
  # Termix API key (technical account "hermes-agent" created in the panel).
  # Consumed by services/termix-mcp (mcp-host MCP). Tower only: the
  # panel exists only on tower and the key is valid only for it.
  - path_regex: secrets/termix\.yml$
    key_groups:
      - age:
          - *tower
  # Gate of the Hermes Webapp (Desktop front served on hermes.marcpartensky.com,
  # services/hermes-webapp): identifier + password + session signing
  # key. Tower only: the gateway that serves the Webapp exists only there.
  - path_regex: secrets/hermes-webapp\.yml$
    key_groups:
      - age:
          - *tower

  # Hermes AGENT secrets, mutualized: a single file for everything the
  # gateway needs (dashboard env, LLM keys, Matrix token, Pangolin key,
  # agent vault password). Meant to replace the copies
  # scattered across tower.yml / anywhere.yml / common.yml / *-mcp.yml, which
  # required a `sops updatekeys` per file for each new host.
  # Recipients: the hosts able to run the gateway (tower,
  # fallback laptop, VPS) plus marc's Mac to be able to edit.
  - path_regex: secrets/hermes-agent\.yml$
    key_groups:
      - age:
          - *tower
          - *laptop
          - *anywhere
          - *mac
  # OIDC secrets of the apps migrated to a DEDICATED ZITADEL PROJECT (one project per
  # app, cf. services/*/default.nix): each app has its own Zitadel client,
  # hence its own secret. tower hosts Gitea/Nextcloud/Immich, anywhere
  # hosts Pangolin; the laptop is included for operational continuity.
  - path_regex: secrets/zitadel-oidc-secrets\.yml$
    key_groups:
      - age:
          - *tower
          - *anywhere
          - *laptop

  # ---------------------------------------------------------------------------
  # Rules recovered from the laptop checkout (2026-11-25). These secret files
  # only ever lived on the laptop: the modules below were never imported by any
  # profile, so the files were never needed on tower. The modules are now in the
  # repo (inert until a profile imports them); these rules make their secrets
  # editable on tower, which is the host that would run them.
  # ---------------------------------------------------------------------------
  # app-publish (services/app-publish-mcp): Google Play service account (JSON) +
  # App Store Connect .p8 key and Key ID / Issuer ID. Placeholders until the
  # developer accounts exist.
  - path_regex: secrets/app-publish\.yml$
    key_groups:
      - age:
          - *tower
  # Enable Banking (services/enable-banking-mcp): app_id + RSA keys of the
  # personal open-banking app (JSON, key "app").
  - path_regex: secrets/enable-banking\.yml$
    key_groups:
      - age:
          - *tower
  # Direct DeepSeek API key of hermes (bypass OpenRouter): dotenv content read as
  # an EnvironmentFile. Kept separate from tower.yml so the agent can edit it
  # without the tower age key.
  - path_regex: secrets/hermes-deepseek\.yml$
    key_groups:
      - age:
          - *tower
  # Nextcloud <-> Zitadel OIDC client secret (services/nextcloud): written into
  # Nextcloud by occ (encrypted with the instance secret), not read by a unit.
  - path_regex: secrets/nextcloud-oidc\.yml$
    key_groups:
      - age:
          - *tower
  # OAuth clients (google...) used by the publishing/notification MCP servers.
  - path_regex: secrets/oauth-clients\.yml$
    key_groups:
      - age:
          - *tower
  # RustFS (services/rustfs): S3 credentials of the object store that Garage
  # replaced on 11/11/2026. Kept for the module's archive.
  - path_regex: secrets/rustfs\.yml$
    key_groups:
      - age:
          - *tower
  # SimpleFIN Bridge (services/simplefin-mcp): access URL (Basic credentials)
  # giving read access to the Chase accounts.
  - path_regex: secrets/simplefin\.yml$
    key_groups:
      - age:
          - *tower
  # Stripe keys of Winnie (services/winnie).
  - path_regex: secrets/winnie-stripe\.yml$
    key_groups:
      - age:
          - *tower
