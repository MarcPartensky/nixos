<text x="297.0" y="278.0" font-size="9" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">same state dir</text>
<rect x="368" y="76" width="300" height="74" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
<rect x="368" y="76" width="3" height="74" rx="1.5" fill="#b4befe"/>
<text x="379.0" y="95.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">hermes-agent gateway</text>
<text x="379.0" y="110.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one process, several profiles</text>
<text x="379.0" y="123.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">state under /var/lib/hermes</text>
