<text x="42.0" y="82.0" font-size="13" fill="#94e2d5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">surfaces</text>
<text x="42.0" y="100.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">clients, not deployments</text>
<rect x="40" y="114" width="268" height="30" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
