<text x="51.0" y="169.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">Discord bot</text>
<text x="297.0" y="170.0" font-size="9" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">via the API server</text>
<rect x="40" y="186" width="268" height="30" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="40" y="186" width="3" height="30" rx="1.5" fill="#94e2d5"/>
<text x="51.0" y="205.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">mobile app</text>
<text x="297.0" y="206.0" font-size="9" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">Pocket backend</text>
<rect x="40" y="222" width="268" height="30" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="40" y="222" width="3" height="30" rx="1.5" fill="#94e2d5"/>
<text x="51.0" y="241.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">web UI</text>
<text x="297.0" y="242.0" font-size="9" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">isolated profile</text>
<rect x="40" y="258" width="268" height="30" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
