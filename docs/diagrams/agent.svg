<rect x="712" y="56" width="504" height="274" rx="8" fill="#cba6f7" fill-opacity="0.06" stroke="#cba6f7" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="730.0" y="82.0" font-size="13" fill="#cba6f7" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">host integration</text>
<text x="730.0" y="100.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">everything the agent can touch</text>
<rect x="728" y="114" width="472" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="728" y="114" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="739.0" y="133.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">MCP host</text>
<text x="739.0" y="148.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">all hand written MCP servers in one process,</text>
<text x="739.0" y="161.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">restarted by the flake or hot reloaded</text>
<rect x="728" y="190" width="472" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="728" y="190" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="739.0" y="209.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">plugins</text>
<text x="739.0" y="224.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Matrix reactions, Gotify bridge, pane reporting,</text>
<text x="739.0" y="237.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">packaged by Nix and linked at activation</text>
<rect x="728" y="266" width="472" height="51" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="728" y="266" width="3" height="51" rx="1.5" fill="#cba6f7"/>
<text x="739.0" y="285.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">host tools</text>
<text x="739.0" y="300.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">git, nix, browsers, mail, calendar, files</text>
<path d="M 676.0 113.0 L 700.0 113.0" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="24" y="354" width="1192" height="74" rx="8" fill="#f38ba8" fill-opacity="0.06" stroke="#f38ba8" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="379.5" font-size="13" fill="#f38ba8" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">the only path to root</text>
<text x="42.0" y="397.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no ambient privilege, every request is a record</text>
<rect x="42" y="374" width="520" height="34" rx="5" fill="#313244" stroke="#f38ba8" stroke-opacity="0.55" stroke-width="1"/>
<rect x="42" y="374" width="3" height="34" rx="1.5" fill="#f38ba8"/>
<text x="53.0" y="392.5" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">hermes-broker</text>
<text x="159.7" y="394.5" font-size="9" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PAM password or WebAuthn passkey, scoped, rate limited, audited</text>
<rect x="956" y="374" width="238" height="34" rx="5" fill="#313244" stroke="#f38ba8" stroke-opacity="0.55" stroke-width="1"/>
<rect x="956" y="374" width="3" height="34" rx="1.5" fill="#f38ba8"/>
<text x="967.0" y="392.5" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">root on the host</text>
</svg>
