<text x="51.0" y="133.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">Matrix</text>
<text x="297.0" y="134.0" font-size="9" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">rooms and DMs</text>
