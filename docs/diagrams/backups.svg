<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 389" width="1240" height="389" role="img" aria-label="backup pipeline">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/></marker><marker id="arwl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4befe"/></marker></defs>
<rect x="0" y="0" width="1240" height="389" rx="10" fill="#1e1e2e"/>
<text x="24.0" y="28.0" font-size="13" fill="#b4befe" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">backups where the producer is not the server</text>
<text x="24.0" y="46.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a backup the compromised machine can delete is not a backup</text>
<rect x="24" y="56" width="347" height="310" rx="8" fill="#b4befe" fill-opacity="0.06" stroke="#b4befe" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="82.0" font-size="13" fill="#b4befe" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">data host</text>
<text x="42.0" y="100.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">holds the state,</text>
<text x="42.0" y="112.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">runs the fallback</text>
<rect x="40" y="118" width="315" height="64" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="40" y="118" width="3" height="64" rx="1.5" fill="#89b4fa"/>
<text x="51.0" y="137.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">databases</text>
<text x="51.0" y="152.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one dump per app,</text>
<text x="51.0" y="165.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">taken locally</text>
<rect x="40" y="194" width="315" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="40" y="194" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="51.0" y="213.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">agent state</text>
<text x="51.0" y="228.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">config, sessions,</text>
<text x="51.0" y="241.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">skills, plugins</text>
<rect x="40" y="270" width="315" height="77" rx="5" fill="#313244" stroke="#f9e2af" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="40" y="270" width="3" height="77" rx="1.5" fill="#f9e2af"/>
<text x="51.0" y="289.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">fallback at 05:00</text>
<text x="51.0" y="304.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">same pipeline,</text>
<text x="51.0" y="317.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">skipped if a fresh</text>
<text x="51.0" y="330.6" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">archive exists</text>
<path d="M 380.7 210.8 L 436.7 210.8" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="447" y="56" width="347" height="297" rx="8" fill="#94e2d5" fill-opacity="0.06" stroke="#94e2d5" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="464.7" y="82.0" font-size="13" fill="#94e2d5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">producer machine</text>
<text x="464.7" y="100.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pulls, never pushed</text>
<text x="464.7" y="112.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">to, on its own timer</text>
<rect x="463" y="118" width="315" height="64" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="463" y="118" width="3" height="64" rx="1.5" fill="#94e2d5"/>
<text x="473.7" y="137.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">03:10 timer</text>
<text x="473.7" y="152.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">its own schedule,</text>
<text x="473.7" y="165.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">not the server&#x27;s</text>
<rect x="463" y="194" width="315" height="64" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="463" y="194" width="3" height="64" rx="1.5" fill="#94e2d5"/>
<text x="473.7" y="213.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">local staging</text>
<text x="473.7" y="228.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">dumps and archive</text>
<text x="473.7" y="241.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">written to its disk</text>
<rect x="463" y="270" width="315" height="64" rx="5" fill="#313244" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1"/>
<rect x="463" y="270" width="3" height="64" rx="1.5" fill="#a6e3a1"/>
<text x="473.7" y="289.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">encrypt here</text>
<text x="473.7" y="304.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the key never</text>
<text x="473.7" y="317.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">touches the server</text>
<path d="M 803.3 204.3 L 859.3 204.3" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="869" y="56" width="347" height="297" rx="8" fill="#89b4fa" fill-opacity="0.06" stroke="#89b4fa" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="887.3" y="82.0" font-size="13" fill="#89b4fa" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">several machines</text>
<text x="887.3" y="100.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a copy is not</text>
<text x="887.3" y="112.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">on one box</text>
<rect x="885" y="118" width="315" height="64" rx="5" fill="#313244" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1"/>
<rect x="885" y="118" width="3" height="64" rx="1.5" fill="#a6e3a1"/>
<text x="896.3" y="137.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">daily tier</text>
<text x="896.3" y="152.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">yesterday, restorable</text>
<text x="896.3" y="165.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">in minutes</text>
<rect x="885" y="194" width="315" height="64" rx="5" fill="#313244" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1"/>
<rect x="885" y="194" width="3" height="64" rx="1.5" fill="#a6e3a1"/>
<text x="896.3" y="213.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">weekly tier</text>
<text x="896.3" y="228.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a month of history</text>
<text x="896.3" y="241.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">with a slow path</text>
<rect x="885" y="270" width="315" height="64" rx="5" fill="#313244" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1"/>
<rect x="885" y="270" width="3" height="64" rx="1.5" fill="#a6e3a1"/>
<text x="896.3" y="289.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">manual tier</text>
<text x="896.3" y="304.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">before a risky</text>
<text x="896.3" y="317.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">change</text>
</svg>
