<text x="241.0" y="75.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">2 secret</text>
<text x="241.0" y="90.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sops file, materialized</text>
<text x="241.0" y="103.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">at activation</text>
<path d="M 412.0 114.0 L 432.0 114.0" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="436" y="56" width="176" height="116" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="436" y="56" width="3" height="116" rx="1.5" fill="#89b4fa"/>
<text x="447.0" y="75.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">3 database</text>
<text x="447.0" y="90.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">role and database</text>
<text x="447.0" y="103.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">provisioned by the flake</text>
<path d="M 618.0 114.0 L 638.0 114.0" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="642" y="56" width="176" height="116" rx="5" fill="#313244" stroke="#89dceb" stroke-opacity="0.55" stroke-width="1"/>
<rect x="642" y="56" width="3" height="116" rx="1.5" fill="#89dceb"/>
<text x="653.0" y="75.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">4 route</text>
<text x="653.0" y="90.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hostname, target,</text>
<text x="653.0" y="103.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">protocol in Nix</text>
<path d="M 824.0 114.0 L 844.0 114.0" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
