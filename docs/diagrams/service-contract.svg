<rect x="848" y="56" width="3" height="116" rx="1.5" fill="#f9e2af"/>
<text x="859.0" y="75.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">5 auth</text>
<text x="859.0" y="90.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SSO required, or the app</text>
<text x="859.0" y="103.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">authenticates itself</text>
<path d="M 1030.0 114.0 L 1050.0 114.0" fill="none" stroke="#b4befe" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="1054" y="56" width="176" height="116" rx="5" fill="#313244" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1"/>
<rect x="1054" y="56" width="3" height="116" rx="1.5" fill="#a6e3a1"/>
<text x="1065.0" y="75.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">6 URL</text>
<text x="1065.0" y="90.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">public under the wildcard,</text>
<text x="1065.0" y="103.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TLS at the edge only</text>
<rect x="24" y="206" width="1192" height="92" rx="8" fill="#9399b2" fill-opacity="0.06" stroke="#9399b2" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="232.0" font-size="13" fill="#9399b2" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">what this buys</text>
<text x="42.0" y="250.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the same six declarations on every machine, human or agent</text>
<text x="40.0" y="276.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">· no port published to the internet anywhere</text>
<text x="316.8" y="276.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">· no certificate outside the edge</text>
<text x="530.9" y="276.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">· a new domain is a rebuild, not a click</text>
<text x="784.9" y="276.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">· a forgotten declaration fails at evaluation</text>
</svg>
