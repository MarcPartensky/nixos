<text x="35.0" y="75.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">1 module</text>
<text x="35.0" y="90.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">package, dedicated user,</text>
<text x="35.0" y="103.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">unit file</text>
