<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 322" width="1240" height="322" role="img" aria-label="the contract of a service">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/></marker><marker id="arwl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4befe"/></marker></defs>
<rect x="0" y="0" width="1240" height="322" rx="10" fill="#1e1e2e"/>
<text x="24.0" y="28.0" font-size="13" fill="#b4befe" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">the contract of a service: six declarations, no runtime surprises</text>
<rect x="24" y="56" width="176" height="116" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
