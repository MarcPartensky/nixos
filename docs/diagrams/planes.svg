<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 497" width="1240" height="497" role="img" aria-label="the four planes of the platform">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/></marker><marker id="arwl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4befe"/></marker></defs>
<rect x="0" y="0" width="1240" height="497" rx="10" fill="#1e1e2e"/>
<rect x="24" y="24" width="1192" height="100" rx="8" fill="#b4befe" fill-opacity="0.06" stroke="#b4befe" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="50.0" font-size="13" fill="#b4befe" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">Control plane</text>
<text x="42.0" y="68.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no runtime configuration, ever</text>
<rect x="238" y="42" width="228" height="64" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
<rect x="238" y="42" width="3" height="64" rx="1.5" fill="#b4befe"/>
<text x="249.0" y="61.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">one flake</text>
<text x="249.0" y="76.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every machine and every input</text>
<text x="249.0" y="89.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pinned by revision</text>
<rect x="478" y="42" width="228" height="64" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
<rect x="478" y="42" width="3" height="64" rx="1.5" fill="#b4befe"/>
<text x="489.0" y="61.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">pure evaluation</text>
<text x="489.0" y="76.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no getEnv, no getFlake,</text>
<text x="489.0" y="89.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no path outside the store</text>
<rect x="718" y="42" width="228" height="64" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
<rect x="718" y="42" width="3" height="64" rx="1.5" fill="#b4befe"/>
<text x="729.0" y="61.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">gated rebuild</text>
<text x="729.0" y="76.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">serialized by a lock,</text>
<text x="729.0" y="89.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">impure refused for all</text>
<rect x="958" y="42" width="228" height="64" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
<rect x="958" y="42" width="3" height="64" rx="1.5" fill="#b4befe"/>
<text x="969.0" y="61.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">two speeds</text>
<text x="969.0" y="76.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">structural change pays the</text>
<text x="969.0" y="89.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">evaluation, containers do not</text>
<rect x="24" y="140" width="1192" height="100" rx="8" fill="#94e2d5" fill-opacity="0.06" stroke="#94e2d5" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="166.2" font-size="13" fill="#94e2d5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">Identity plane</text>
<text x="42.0" y="184.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">checked before the app runs</text>
<rect x="238" y="158" width="228" height="64" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="238" y="158" width="3" height="64" rx="1.5" fill="#94e2d5"/>
<text x="249.0" y="177.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">one OIDC provider</text>
<text x="249.0" y="192.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">services that speak OIDC</text>
<text x="249.0" y="205.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">authenticate themselves</text>
<rect x="478" y="158" width="228" height="64" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="478" y="158" width="3" height="64" rx="1.5" fill="#94e2d5"/>
<text x="489.0" y="177.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">proxy level SSO</text>
<text x="489.0" y="192.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">apps without auth inherit</text>
<text x="489.0" y="205.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">it from the edge</text>
<rect x="718" y="158" width="228" height="64" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="718" y="158" width="3" height="64" rx="1.5" fill="#94e2d5"/>
<text x="729.0" y="177.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">brokered privilege</text>
<text x="729.0" y="192.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">PAM password or passkey,</text>
<text x="729.0" y="205.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scoped and audited</text>
<rect x="958" y="158" width="228" height="64" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="958" y="158" width="3" height="64" rx="1.5" fill="#94e2d5"/>
<text x="969.0" y="177.2" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">per machine keys</text>
<text x="969.0" y="192.2" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one age key per host:</text>
<text x="969.0" y="205.3" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">it decrypts only its own file</text>
<rect x="24" y="256" width="1192" height="100" rx="8" fill="#89b4fa" fill-opacity="0.06" stroke="#89b4fa" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="282.4" font-size="13" fill="#89b4fa" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">Data plane</text>
<text x="42.0" y="300.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lifecycle over storage</text>
<rect x="238" y="274" width="228" height="64" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="238" y="274" width="3" height="64" rx="1.5" fill="#89b4fa"/>
<text x="249.0" y="293.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">database per app</text>
<text x="249.0" y="308.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">role and database declared</text>
<text x="249.0" y="321.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">in the flake</text>
<rect x="478" y="274" width="228" height="64" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="478" y="274" width="3" height="64" rx="1.5" fill="#89b4fa"/>
<text x="489.0" y="293.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">object store</text>
<text x="489.0" y="308.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">build artifacts and a</text>
<text x="489.0" y="321.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">mirror of phone photos</text>
<rect x="718" y="274" width="228" height="64" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="718" y="274" width="3" height="64" rx="1.5" fill="#89b4fa"/>
<text x="729.0" y="293.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">ZFS datasets</text>
<text x="729.0" y="308.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">snapshots, capped cache,</text>
<text x="729.0" y="321.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">compressed swap first</text>
<rect x="958" y="274" width="228" height="64" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="958" y="274" width="3" height="64" rx="1.5" fill="#89b4fa"/>
<text x="969.0" y="293.4" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">backup tiers</text>
<text x="969.0" y="308.4" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">daily, weekly, manual,</text>
<text x="969.0" y="321.5" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">encrypted post quantum</text>
<rect x="24" y="373" width="1192" height="100" rx="8" fill="#cba6f7" fill-opacity="0.06" stroke="#cba6f7" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="398.6" font-size="13" fill="#cba6f7" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">Agent plane</text>
<text x="42.0" y="416.6" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools, not credentials</text>
<rect x="238" y="391" width="228" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="238" y="391" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="249.0" y="409.6" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">one gateway</text>
<text x="249.0" y="424.6" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">several surfaces and</text>
<text x="249.0" y="437.7" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">profiles, one process</text>
<rect x="478" y="391" width="228" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="478" y="391" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="489.0" y="409.6" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">one MCP host</text>
<text x="489.0" y="424.6" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">all hand written servers,</text>
<text x="489.0" y="437.7" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a single process</text>
<rect x="718" y="391" width="228" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="718" y="391" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="729.0" y="409.6" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">plugins by Nix</text>
<text x="729.0" y="424.6" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">linked at activation,</text>
<text x="729.0" y="437.7" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">not installed by hand</text>
<rect x="958" y="391" width="228" height="64" rx="5" fill="#313244" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1"/>
<rect x="958" y="391" width="3" height="64" rx="1.5" fill="#cba6f7"/>
<text x="969.0" y="409.6" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">one path to root</text>
<text x="969.0" y="424.6" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no sudo: the broker is</text>
<text x="969.0" y="437.7" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the only door</text>
</svg>
