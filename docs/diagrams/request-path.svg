<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 338" width="1240" height="338" role="img" aria-label="one request end to end">
<defs><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/></marker><marker id="arwl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b4befe"/></marker></defs>
<rect x="0" y="0" width="1240" height="338" rx="10" fill="#1e1e2e"/>
<text x="24.0" y="28.0" font-size="13" fill="#b4befe" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">one request, end to end</text>
<text x="24.0" y="46.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">identity is decided before the application is reached</text>
<rect x="24" y="64" width="174" height="108" rx="5" fill="#313244" stroke="#9399b2" stroke-opacity="0.55" stroke-width="1"/>
<rect x="24" y="64" width="3" height="108" rx="1.5" fill="#9399b2"/>
<text x="35.0" y="83.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">visitor</text>
<text x="35.0" y="98.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a browser, no</text>
<text x="35.0" y="111.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">certificate, no VPN</text>
<path d="M 203.7 118.0 L 223.7 118.0" fill="none" stroke="#6c7086" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="228" y="64" width="174" height="108" rx="5" fill="#313244" stroke="#89dceb" stroke-opacity="0.55" stroke-width="1"/>
<rect x="228" y="64" width="3" height="108" rx="1.5" fill="#89dceb"/>
<text x="238.7" y="83.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">wildcard DNS</text>
<text x="238.7" y="98.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">every name resolves</text>
<text x="238.7" y="111.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">to the same edge</text>
<path d="M 407.3 118.0 L 427.3 118.0" fill="none" stroke="#6c7086" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="431" y="64" width="174" height="108" rx="5" fill="#313244" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1"/>
<rect x="431" y="64" width="3" height="108" rx="1.5" fill="#b4befe"/>
<text x="442.3" y="83.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">edge: TLS</text>
<text x="442.3" y="98.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one certificate,</text>
<text x="442.3" y="111.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one listening port</text>
<path d="M 611.0 118.0 L 631.0 118.0" fill="none" stroke="#6c7086" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="635" y="64" width="174" height="108" rx="5" fill="#313244" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1"/>
<rect x="635" y="64" width="3" height="108" rx="1.5" fill="#94e2d5"/>
<text x="646.0" y="83.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">identity check</text>
<text x="646.0" y="98.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">session valid, or</text>
<text x="646.0" y="111.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">redirect to login</text>
<path d="M 814.7 118.0 L 834.7 118.0" fill="none" stroke="#6c7086" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="839" y="64" width="174" height="108" rx="5" fill="#313244" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1"/>
<rect x="839" y="64" width="3" height="108" rx="1.5" fill="#89b4fa"/>
<text x="849.7" y="83.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">outbound tunnel</text>
<text x="849.7" y="98.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the data host dials</text>
<text x="849.7" y="111.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">out, never the reverse</text>
<path d="M 1018.3 118.0 L 1038.3 118.0" fill="none" stroke="#6c7086" stroke-width="1.3" marker-end="url(#arw)"/>
<rect x="1042" y="64" width="174" height="108" rx="5" fill="#313244" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1"/>
<rect x="1042" y="64" width="3" height="108" rx="1.5" fill="#a6e3a1"/>
<text x="1053.3" y="83.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">the app</text>
<text x="1053.3" y="98.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">HTTP on loopback,</text>
<text x="1053.3" y="111.1" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">no public port</text>
<rect x="24" y="218" width="1192" height="96" rx="8" fill="#f9e2af" fill-opacity="0.06" stroke="#f9e2af" stroke-width="1.2" stroke-opacity="0.75"/>
<text x="42.0" y="244.0" font-size="13" fill="#f9e2af" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="700">the branch that matters</text>
<text x="42.0" y="262.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">does the application speak OIDC</text>
<rect x="42" y="242" width="566" height="54" rx="5" fill="#313244" stroke="#f9e2af" stroke-opacity="0.55" stroke-width="1"/>
<rect x="42" y="242" width="3" height="54" rx="1.5" fill="#f9e2af"/>
<text x="53.0" y="261.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">yes: the app authenticates itself</text>
<text x="53.0" y="276.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">it validates the session and keeps its own users</text>
<rect x="632" y="242" width="566" height="54" rx="5" fill="#313244" stroke="#f9e2af" stroke-opacity="0.55" stroke-width="1"/>
<rect x="632" y="242" width="3" height="54" rx="1.5" fill="#f9e2af"/>
<text x="643.0" y="261.0" font-size="11.5" fill="#cdd6f4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">no: the proxy enforces SSO</text>
<text x="643.0" y="276.0" font-size="9.5" fill="#9399b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the app never receives an unauthenticated request</text>
</svg>
