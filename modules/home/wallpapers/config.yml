# config.yml

# Directory containing the images
wall_dir: "/home/marc/git/wallpapers"

# How many images "close" to the target to keep for the random draw
# Example: 10 means we take the 10 images whose brightness is closest
# to the target, then pick one at random among those 10.
variability_pool: 10

# awww transition parameters
awww:
  transition_type: "grow"
  transition_pos: "0.5,0.5"
  transition_fps: "60"
  transition_duration: "2"

# Weather factors (1.0 = normal brightness)
weather_factors:
  Sunny: 1.0
  Clear: 1.0
  Partly cloudy: 0.9
  Cloudy: 0.8
  Overcast: 0.7
  Mist: 0.7
  Patchy rain possible: 0.7
  Rain: 0.6
  Snow: 0.8
  Thunderstorm: 0.5
