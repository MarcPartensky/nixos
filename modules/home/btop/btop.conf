# btop de marc : theme Catppuccin Mocha (accent Lavender), ouvert sur le
# classement CPU des process. Ecrit par modules/home/btop/default.nix, lie en
# lecture seule depuis le store : les reglages changes avec F2 dans btop ne
# survivent pas a la sortie, il faut editer ce fichier.
# Reference exhaustive des cles : `btop --default-config`.
# Cles de theme : ./themes/catppuccin_mocha.theme.

color_theme = "catppuccin_mocha"
truecolor = true
theme_background = true

# Boite CPU en haut, table des process en dessous, rien d'autre : ni memoire,
# ni reseau, ni disque. C'est la vue "qui mange le CPU".
# Presets (touches 1 a 3) : 1 = cpu+proc, 2 = cpu+mem+net, 3 = cpu+net en tty.
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
shown_boxes = "cpu proc"

update_ms = 2000

# "cpu lazy" fige la tete du classement et laisse un nouveau process monter
# dans la liste ; "cpu direct" reassigne la premiere ligne a chaque
# echantillon, illisible quand 16 threads bougent tous a 2 s.
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
# Courbe de CPU par process dans la liste : on voit un pic passer, pas
# seulement une valeur instantanee.
proc_cpu_graphs = true
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
# Les threads noyau ne sont pas des consommateurs a chasser.
proc_filter_kernel = true
proc_left = false
proc_follow_detailed = true

# Pas de GPU exploitable sur tower (Vega iGPU, ni CUDA ni ROCm) : la boite GPU
# resterait vide.
show_gpu_info = "Off"

show_uptime = true
show_cpu_freq = true
# Necessite make setcap/setuid sur le binaire, sinon rien ne s'affiche.
show_cpu_watts = false
check_temp = true
show_coretemp = true
clock_format = "%X"

# tower est en ZFS : compter l'ARC dans le cached, sinon la memoire libre
# parait fausse.
zfs_arc_cached = true
show_swap = true

# Le fichier est un lien vers le store : inutile de tenter d'y ecrire l'etat
# de sortie, ca n'imprimerait qu'un avertissement.
save_config_on_exit = false
log_level = "WARNING"
