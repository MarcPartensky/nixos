# marc's btop: Catppuccin Mocha theme (Lavender accent), opened on the
# CPU ranking of processes. Written by modules/home/btop/default.nix, linked
# read-only from the store: settings changed with F2 in btop do not
# survive exit, you must edit this file.
# Exhaustive reference of the keys: `btop --default-config`.
# Theme keys: ./themes/catppuccin_mocha.theme.

color_theme = "catppuccin_mocha"
truecolor = true
theme_background = true

# CPU box at the top, process table below, nothing else: no memory,
# no network, no disk. It is the "who is eating the CPU" view.
# Presets (keys 1 to 3): 1 = cpu+proc, 2 = cpu+mem+net, 3 = cpu+net in tty.
presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
shown_boxes = "cpu proc"

update_ms = 2000

# "cpu lazy" freezes the top of the ranking and lets a new process rise
# in the list; "cpu direct" reassigns the first line on every
# sample, unreadable when 16 threads all move at 2 s.
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = false
# CPU curve per process in the list: you see a spike go by, not
# just an instantaneous value.
proc_cpu_graphs = true
proc_colors = true
proc_gradient = true
proc_per_core = false
proc_mem_bytes = true
# Kernel threads are not consumers to hunt down.
proc_filter_kernel = true
proc_left = false
proc_follow_detailed = true

# No usable GPU on tower (Vega iGPU, neither CUDA nor ROCm): the GPU box
# would stay empty.
show_gpu_info = "Off"

show_uptime = true
show_cpu_freq = true
# Requires make setcap/setuid on the binary, otherwise nothing shows.
show_cpu_watts = false
check_temp = true
show_coretemp = true
clock_format = "%X"

# tower is on ZFS: count the ARC as cached, otherwise free memory
# looks wrong.
zfs_arc_cached = true
show_swap = true

# The file is a link to the store: pointless to try writing the exit
# state into it, it would only print a warning.
save_config_on_exit = false
log_level = "WARNING"
