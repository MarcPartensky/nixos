# herdr config (agent multiplexer, github:ogulcancelik/herdr).
# Goal: see the Hermes model of each pane in the sidebar, without typing anything.
#
# Principle: the hermes TUI writes its OSC title in the form
#   <state> <session> . <model> . <cwd>      (blocked, working, idle)
# herdr reads this title (it already uses it for the blocked/working/done state, cf
# ~/.local/state/herdr/agent-detection/remote/hermes.toml) and exposes it to the
# sidebar lines via the terminal_title_stripped token.
[ui]
# Agent label on the borders of split panes (the pane title already carries the model).
show_agent_labels_on_pane_borders = true
# Title written to the host terminal: the WM's tab bars follow the active pane.
window_title = "{hostname}: {workspace} · {terminal_title}"

# Rows per agent: by default herdr does not show the terminal title, only
# the agent ("hermes"), which does not say which model runs in the pane.
[ui.sidebar.agents.rows_by_agent]
hermes = [
  ["state_icon", "machine", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]
